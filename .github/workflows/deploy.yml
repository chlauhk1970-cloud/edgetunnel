name: Deploy to Across Multiple Cloudflare Accounts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    strategy:
      fail-fast: false # 💡 加上這一行：即使其中一個帳戶失敗，其他帳戶也會繼續完成上傳！
      matrix:
        include:
          # ⚠️ 請再次核對：左邊必須是 32位元 ID，右邊必須是網站名稱
          - account_id: 'cb83269139ac584fca2473765a77aec7' # 請確認這是不是 skyportal 帳戶的 ID
            project_name: 'skyportal'

          - account_id: '7b2ee628a48fa4caeb5db4d0cd16b462' # 請確認這是不是 neoportal 帳戶的 ID
            project_name: 'neoportal'

          - account_id: 'd8df067cdba2163cdb32fbf538b80fd7' # 請確認這是不是 voxportal 帳戶的 ID
            project_name: 'voxportal'

          - account_id: '376b8acd0645dccbd5741dc8dbf845f3' # 請確認這是不是 ecoportal 帳戶的 ID
            project_name: 'ecoportal'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ matrix.account_id }}
          projectName: ${{ matrix.project_name }}
          directory: '.'
